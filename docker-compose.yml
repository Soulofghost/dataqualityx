version: '3.8'

services:
  dataqualityx:
    build: .
    container_name: dataqualityx-service
    ports:
      - "8000:8000"
    environment:
      - DATAQUALITYX_PORT=8000
      - DATAQUALITYX_DB_PATH=backend/data/dataqualityx.db
    volumes:
      - dataqualityx-data:/app/backend/data
    restart: unless-stopped

volumes:
  dataqualityx-data:
